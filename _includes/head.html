<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.layout == 'category' %}{{ site.title }} - Work{% elsif page.layout == 'about' %}{{ site.title }} - About{% elsif page.layout == 'article' %}{{ page.title }}{% else %}{{ page.title | default: site.title }}{% endif %}</title>
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<!-- Latin fonts: plain CSS kit, loads immediately -->
<link rel="stylesheet" href="https://use.typekit.net/iqu5sby.css">
<!-- Start the Latin web-font loads now, while the document is still parsing, instead of at the first
     layout: the first paint — and the first frame of any inbound view transition — then already has
     the fonts, so there is no invisible-text period followed by a document-wide re-layout 50–100ms
     into the transition (the vtdebug telemetry showed fonts still "loading" at pagereveal) -->
<script>
  (function () {
    if (!document.fonts || !document.fonts.load) return;
    ['1em linotype-sabon', 'italic 1em linotype-sabon', '1em monotype-grotesque', 'italic 1em monotype-grotesque']
      .forEach(function (f) { try { document.fonts.load(f).catch(function () {}); } catch (err) {} });
  })();
</script>
<!-- CJK font (sandoll-myeongjoneo1): JS kit, required for dynamic subsetting. Loaded only
     AFTER any cross-document view transition has finished: the kit inserts a stylesheet when it
     arrives, and Safari rebuilds styles on that, which restarts a running transition from the
     beginning (the article exit slide stuttered: down, snap back, down again). -->
<script>
  function loadTypekit() {
    (function(d) {
    var config = {
      kitId: 'drp7rse',
      scriptTimeout: 3000,
      async: true
    },
    h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
  })(document);
  }
  (function () {
    var done = false;
    function go() { if (done) return; done = true; loadTypekit(); }
    if ('onpagereveal' in window) {
      window.addEventListener('pagereveal', function (e) {
        if (e.viewTransition) e.viewTransition.finished.then(go, go); else go();
      });
      setTimeout(go, 1500); // safety net: fonts never wait on a transition that never settles
    } else {
      go();
    }
  })();
</script>
<link rel="stylesheet" href="{{ "/tailwind.css" | relative_url }}?v={{ site.time | date: "%s" }}">
<!-- Hold the first paint until the whole page is parsed and its inline scripts have run
     (#page-end is the last element in every layout). Cross-document view transitions start at
     the first paint: without this, the slide began over a half-built page and the content
     popped in mid-slide. Supported in Chrome 124+ and Safari 18.2+; ignored elsewhere. -->
<link rel="expect" href="#page-end" blocking="render">
<script>
  // Transition telemetry (debugging aid, no visible effect unless the URL contains "vtdebug"):
  // records how this page's inbound view transition rendered — reveal/ready/finished times,
  // requestAnimationFrame gaps over 34ms (main-thread stalls), font and image readiness — in
  // sessionStorage['vt-telemetry'], and with ?vtdebug=1 prints it in a corner overlay.
  (function () {
    var rec = { page: location.pathname, vp: innerWidth + 'x' + innerHeight + '@' + devicePixelRatio,
                ua: (navigator.userAgent.match(/(Version\/[\d.]+ Safari|Chrome\/[\d.]+|Firefox\/[\d.]+)/) || [''])[0] };
    function now() { return Math.round(performance.now()); }
    function imgs() { var a = document.images, c = 0; for (var i = 0; i < a.length; i++) if (a[i].complete) c++; return c + '/' + a.length; }
    function save() {
      try { sessionStorage.setItem('vt-telemetry', JSON.stringify(rec)); } catch (err) {}
      if (location.search.indexOf('vtdebug') === -1 || !document.body) return;
      var el = document.getElementById('vt-debug');
      if (!el) {
        el = document.createElement('pre'); el.id = 'vt-debug';
        el.style.cssText = 'position:fixed;left:0;bottom:0;z-index:9999;margin:0;padding:8px 10px;background:rgba(0,0,0,.82);color:#9f9;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-width:min(70vw,40rem);pointer-events:none';
        document.body.appendChild(el);
      }
      el.textContent = JSON.stringify(rec, null, 1).replace(/[{}"]/g, '');
    }
    window.addEventListener('pagereveal', function (e) {
      rec.reveal = now(); rec.vt = !!e.viewTransition; rec.readyState = document.readyState;
      rec.fontsAtReveal = document.fonts ? document.fonts.status : '?'; rec.imgsAtReveal = imgs();
      if (document.fonts) document.fonts.ready.then(function () { rec.fontsReady = now(); });
      var gaps = [], last = performance.now(), frames = 0, stop = false;
      function tick(t) { frames++; var g = t - last; if (g > 34) gaps.push(Math.round(last) + '+' + Math.round(g)); last = t; if (!stop) requestAnimationFrame(tick); }
      requestAnimationFrame(tick);
      function done(tag) { stop = true; rec[tag] = now(); rec.frames = frames; rec.gaps = gaps.length ? gaps.join(' ') : 'none'; rec.imgsAtEnd = imgs(); save(); }
      if (e.viewTransition) {
        e.viewTransition.ready.then(function () { rec.ready = now(); rec.fontsAtReady = document.fonts ? document.fonts.status : '?'; rec.imgsAtReady = imgs(); }, function () { rec.ready = 'rejected'; });
        e.viewTransition.finished.then(function () { done('finished'); }, function () { done('finished'); });
      } else {
        setTimeout(function () { done('end'); }, 800);
      }
    });
    window.addEventListener('load', function () { rec.load = now(); rec.imgsAtLoad = imgs(); save(); });
  })();
</script>
<!-- Cross-document view transitions: LEVEL1/2 ↔ LEVEL3 slide, default crossfade elsewhere (main.css) -->
<style>@view-transition { navigation: auto; }</style>
{% unless page.layout == 'article' %}
<script>
  // Non-article pages: every navigation that is not the LEVEL3 slide plays the browser's
  // default root crossfade (0.25s, like davidchipperfield.com). Arriving from an article's ×
  // must NOT crossfade (the panel slides down over this page instead), so the article flags
  // the exit in sessionStorage during pageswap and this page raises data-vt-from-article
  // before its first paint; main.css then keeps the root snapshots static for that one
  // transition. The flag expires after 3s so an abandoned navigation cannot leave it behind.
  (function () {
    var html = document.documentElement;
    var fromArticle = false;
    var flag = sessionStorage.getItem('vt-from-article');
    if (flag) {
      sessionStorage.removeItem('vt-from-article');
      fromArticle = Date.now() - parseInt(flag, 10) < 3000;
    }
    // Belt and braces: a fresh navigation whose referrer is one of our article pages is an
    // article exit too (× uses location.replace, the navbar links are plain navigations), even
    // if the article page that sent us here was an older cached copy without the flag
    if (!fromArticle) {
      try {
        var ref = document.referrer ? new URL(document.referrer) : null;
        var nav = performance.getEntriesByType('navigation')[0];
        if (ref && ref.host === location.host && ref.pathname.indexOf('/articles/') === 0 &&
            nav && nav.type === 'navigate') fromArticle = true;
      } catch (err) {}
    }
    if (fromArticle) html.setAttribute('data-vt-from-article', '');
    // data-vt-active marks the inbound transition while it runs; window.vtReady resolves once it
    // has finished (or at once when there is none), so entry animations (the Work grid's
    // staggered thumbnail fade) can wait for the teardown instead of overlapping it — Safari
    // flickered the loading thumbnails when both ran together.
    var done;
    window.vtReady = new Promise(function (r) { done = r; });
    var hasReveal = ('onpagereveal' in window) || (typeof PageRevealEvent !== 'undefined');
    if (!hasReveal) done();
    window.addEventListener('pagereveal', function (e) {
      function clear() {
        html.removeAttribute('data-vt-from-article');
        html.removeAttribute('data-vt-active');
        done();
      }
      // data-vt-last stays on the page: a debugging aid that records whether this page's
      // arrival ran a view transition ("fade") or not ("none")
      html.setAttribute('data-vt-last', e.viewTransition ? 'fade' : 'none');
      if (e.viewTransition) {
        html.setAttribute('data-vt-active', '');
        e.viewTransition.finished.then(clear, clear);
      } else {
        clear();
      }
      setTimeout(clear, 1500);
    });
  })();
</script>
{% endunless %}
<script>
  // LEVEL3 slide flags: only fresh navigations get the entry/exit view transition (main.css)
  (function () {
    var html = document.documentElement;
    if (html.dataset.level !== '3') return;
    var nav = performance.getEntriesByType('navigation')[0];
    // Only raise the entry flag where pagereveal exists to lower it again; otherwise the
    // navbar gradient (header-nav.html) would stay painted over the sheet's title and ×
    var hasReveal = ('onpagereveal' in window) || (typeof PageRevealEvent !== 'undefined');
    if (hasReveal && nav && nav.type === 'navigate') html.setAttribute('data-vt-enter', '');
    window.addEventListener('pagereveal', function (e) {
      html.removeAttribute('data-vt-exit'); // stale after a bfcache round trip
      function clear() { html.removeAttribute('data-vt-enter'); }
      if (e.viewTransition) e.viewTransition.finished.then(clear, clear);
      else clear();
      // Safety net: the flag also clips the mobile article panel to one viewport (main.css), so
      // it must never outlive a transition that stalls (e.g. a background tab never finishing it)
      setTimeout(clear, 1500);
    });
    window.addEventListener('pageswap', function (e) {
      // Drop the entry flag before bfcache snapshots this page, or a later return replays it
      html.removeAttribute('data-vt-enter');
      // White-back the navbar for the old-state capture so it can fade out (vt-navbar-out),
      // and tell the destination not to crossfade under the slide-down (see the block above)
      if (e.viewTransition) {
        html.setAttribute('data-vt-exit', '');
        sessionStorage.setItem('vt-from-article', String(Date.now()));
      }
    });
  })();

</script>
